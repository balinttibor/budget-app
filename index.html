<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1013">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<style>
  html, body { margin: 0; height: 100%; background: #f4f5f7; overflow: hidden; }
  @media (prefers-color-scheme: dark) { html, body { background: #0e1013; } }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 15px -apple-system, Roboto, sans-serif; color: #6b7280; }
  #loading img { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 0 auto 14px; }
  #setup { display: none; position: fixed; inset: 0; padding: 32px 20px; font: 15px/1.5 -apple-system, Roboto, sans-serif; color: #16181d; }
  #setup input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 15px; border: 1px solid #d1d5db; border-radius: 10px; margin: 10px 0; }
  #setup button { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: #0f766e; color: #fff; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<div id="loading"><div><img src="icon-192.png" alt="">Loading…</div></div>

<div id="setup">
  <h2 style="margin-top:0">Budget</h2>
  <p>Paste the web app link from Apps Script (it ends with <b>/exec</b>):</p>
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  <button id="saveUrl">Save</button>
  <p style="color:#6b7280;font-size:13px">The link is stored only on this device.</p>
</div>

<script>
  // Optional: put your /exec link here so you don't have to paste it on each device.
  var APP_URL = '';

  function getUrl() {
    var u = APP_URL;
    try { u = u || localStorage.getItem('budget.appUrl') || ''; } catch (e) {}
    return u;
  }
  function start(u) {
    var f = document.createElement('iframe');
    f.src = u;
    f.title = 'Budget';
    f.allow = 'clipboard-write';
    f.onload = function () { document.getElementById('loading').style.display = 'none'; };
    document.body.appendChild(f);
  }
  var url = getUrl();
  if (/^https:\/\/script\.google\.com\/.+\/exec/.test(url)) {
    start(url);
  } else {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('setup').style.display = 'block';
    document.getElementById('saveUrl').onclick = function () {
      var v = document.getElementById('url').value.trim();
      if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(v)) { alert('This does not look like an Apps Script /exec link.'); return; }
      try { localStorage.setItem('budget.appUrl', v); } catch (e) {}
      document.getElementById('setup').style.display = 'none';
      document.getElementById('loading').style.display = 'grid';
      start(v);
    };
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
